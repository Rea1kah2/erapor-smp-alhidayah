services:
  - type: web
    name: erapor-smp-alhidayah-api-staging
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health/ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: COOKIE_SAME_SITE
        value: none
      - key: NODE_ENV
        value: production
